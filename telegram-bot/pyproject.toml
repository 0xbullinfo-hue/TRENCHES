[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trenchlabshq-telegram-bot"
version = "0.1.0"
description = "TrenchLabsHQ Telegram membership and signal bot"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29,<1",
  "base58>=2.1,<3",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "PyNaCl>=1.5,<2",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot[job-queue]>=20,<23",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
include = ["bot*", "lib*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
