services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trenchlabs
      POSTGRES_USER: trenchlabs
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trenchlabs -d trenchlabs"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trenchlabs:local-dev-only@db:5432/trenchlabs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
